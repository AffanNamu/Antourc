name: assistlink
description: Consent-based Android remote assistance client.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  permission_handler: ^11.3.1
  livekit_client: ^2.4.6
  flutter_secure_storage: ^9.2.4
  flutter_background: ^1.3.1
  flutter_webrtc: ^1.6.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
