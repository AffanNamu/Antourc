services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: assistlink
      POSTGRES_USER: assistlink
      POSTGRES_PASSWORD: assistlink
    ports:
      - "5432:5432"
    volumes:
      - assistlink_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistlink -d assistlink"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  assistlink_postgres:
