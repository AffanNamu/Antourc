name: Backend checks

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-check.yml'

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: assistlink
          POSTGRES_USER: assistlink
          POSTGRES_PASSWORD: assistlink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assistlink -d assistlink"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://assistlink:assistlink@localhost:5432/assistlink
      ACCESS_TOKEN_SECRET: test-access-token-secret-at-least-32-characters
      OTP_HMAC_SECRET: test-otp-hmac-secret-at-least-32-characters
      LIVEKIT_URL: wss://example.livekit.cloud
      LIVEKIT_API_KEY: test-key
      LIVEKIT_API_SECRET: test-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Apply database migrations
        run: npm run db:migrate
